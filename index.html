<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 新聞 · 2026-10-05</title>
  <meta name="description" content="2026年10月5日 AI 新聞：一定要知、技術、技能，各五則。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,560;7..72,700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3efe4;
      --ink: #1b1712;
      --muted: #5e564c;
      --line: #ddd4c4;
      --card: #fffdf8;
      --accent: #9a3412;
      --accent-soft: #f3e0d4;
      --chip: #efe8da;
      --shadow: 0 1px 0 rgba(27, 23, 18, 0.04);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background:
        radial-gradient(1200px 420px at 10% -10%, #f7e7d4 0%, transparent 55%),
        var(--bg);
      color: var(--ink);
      font-family: "Noto Sans TC", "PingFang TC", "Noto Sans CJK TC", sans-serif;
      font-size: 17px;
      line-height: 1.65;
    }
    a { color: var(--accent); }
    a:hover { text-decoration-thickness: 2px; }
    .wrap { width: min(1080px, calc(100% - 32px)); margin: 0 auto; }
    header.mast {
      padding: 28px 0 8px;
      border-bottom: 1px solid var(--ink);
    }
    .kicker {
      margin: 0;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
    }
    h1 {
      font-family: Literata, "Iowan Old Style", Palatino, "Songti TC", serif;
      font-size: clamp(40px, 8vw, 68px);
      line-height: 0.95;
      font-weight: 560;
      margin: 8px 0 10px;
      letter-spacing: -0.03em;
    }
    .edition {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      align-items: baseline;
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 14px;
    }
    .edition strong { color: var(--ink); font-weight: 700; }
    nav {
      display: flex;
      gap: 8px;
      padding: 14px 0 18px;
      position: sticky;
      top: 0;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(8px);
      z-index: 2;
    }
    nav a {
      text-decoration: none;
      background: var(--chip);
      color: var(--ink);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 700;
    }
    nav a:hover, nav a:focus-visible { background: var(--accent-soft); }
    .intro {
      font-size: 18px;
      max-width: 42rem;
      margin: 0 0 8px;
    }
    section { padding: 8px 0 28px; }
    section h2 {
      font-family: Literata, Palatino, "Songti TC", serif;
      font-size: 32px;
      margin: 0 0 4px;
      letter-spacing: -0.03em;
    }
    .section-label {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    ol.stories {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }
    article {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 16px 14px;
      box-shadow: var(--shadow);
    }
    .meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    article h3 {
      font-family: Literata, Palatino, "Songti TC", serif;
      font-size: 22px;
      line-height: 1.25;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    article p { margin: 0 0 12px; }
    .source-link {
      font-size: 14px;
      font-weight: 700;
      text-underline-offset: 3px;
    }
    footer {
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      padding: 18px 0 36px;
    }
    .status {
      padding: 18px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      background: var(--card);
    }
    @media (min-width: 900px) {
      ol.stories { grid-template-columns: 1fr 1fr; }
      ol.stories article:first-child { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="mast">
      <p class="kicker">Scott · daily digest</p>
      <h1>AI 新聞</h1>
      <p class="edition" id="edition">載入緊…</p>
      <p class="intro" id="intro"></p>
    </header>
    <nav aria-label="欄目">
      <a href="#mustKnow">一定要知</a>
      <a href="#tech">技術</a>
      <a href="#skills">技能</a>
    </nav>
    <main id="main">
      <p class="status">載入緊 data.json…</p>
    </main>
    <footer>
      <p>靜態頁。資料係 <code>data.json</code>，欄位見 <code>schema/digest.schema.json</code>。每則摘要連去原始報道，唔係模型自行發揮的細節。</p>
    </footer>
  </div>
  <script>
    const SECTIONS = [
      ["mustKnow", "一定要知", "五則，今日決策用"],
      ["tech", "技術", "五則，價錢、上下文、決策模型"],
      ["skills", "技能", "五則，本週可以落手"]
    ];

    function esc(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function renderItem(item) {
      return `<article>
        <div class="meta"><span>${esc(item.source)}</span><time datetime="${esc(item.published)}">${esc(item.published)}</time></div>
        <h3>${esc(item.title)}</h3>
        <p>${esc(item.summary)}</p>
        <a class="source-link" href="${esc(item.url)}">睇原文</a>
      </article>`;
    }

    function render(data) {
      document.title = `AI 新聞 · ${data.edition}`;
      document.getElementById("edition").innerHTML =
        `<strong>${esc(data.edition)}</strong><span>${esc(data.weekday)}</span><span>資料更新至 ${esc(data.asOf)}</span>`;
      document.getElementById("intro").textContent = data.intro;
      document.getElementById("main").innerHTML = SECTIONS.map(([key, label, note]) => {
        const items = data[key] || [];
        return `<section id="${key}" aria-labelledby="${key}-title">
          <p class="section-label">${esc(note)} · ${items.length}</p>
          <h2 id="${key}-title">${esc(label)}</h2>
          <ol class="stories">${items.map(renderItem).join("")}</ol>
        </section>`;
      }).join("");
    }

    fetch("data.json")
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then(render)
      .catch((error) => {
        document.getElementById("main").innerHTML =
          `<p class="status">載入唔到 data.json（${esc(error.message)}）。請用 HTTP 開啟，例如 <code>python3 -m http.server</code>，唔好用 file://。</p>`;
      });
  </script>
</body>
</html>
